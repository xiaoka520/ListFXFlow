name: Build and verify
on: [push, pull_request, workflow_dispatch]
jobs:
  mac:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show Swift toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Test Mac and clipboard pasteboard formats
        run: swift test
      - name: Test native PTP report buffer with sanitizers
        run: |
          clang -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined Tests/native/ptp_ring_test.c -o "$RUNNER_TEMP/ptp-ring-test"
          "$RUNNER_TEMP/ptp-ring-test"
      - name: Build Mac installers
        env:
          SIGN_IDENTITY: '-'
        run: zsh scripts/build-mac.sh
      - uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: ListFXFlow-Mac
          path: |
            artifacts/ListFXFlow-Mac-*.dmg
            artifacts/ListFXFlow-Mac-*.zip
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet run --project windows/FlowCore.Tests/FlowCore.Tests.csproj -c Release
      - name: Test native Windows clipboard image formats
        run: dotnet run --project windows/ClipboardNative.Tests/ClipboardNative.Tests.csproj -c Release
      - run: ./scripts/build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: ListFXFlow-Windows
          path: |
            artifacts/ListFXFlow-Setup-*.exe
            artifacts/ListFXFlow-Windows-*.zip
