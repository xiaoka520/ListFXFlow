name: Build PTP observer driver
on:
  push:
    paths: ['windows/Drivers/**', 'scripts/*ptp*.ps1', 'scripts/Prepare-PtpDriver.ps1', 'scripts/ptp-trial/**', 'docs/PTP-DRIVER.md', '.github/workflows/ptp-driver.yml']
  pull_request:
    paths: ['windows/Drivers/**', 'scripts/*ptp*.ps1', 'scripts/Prepare-PtpDriver.ps1', 'scripts/ptp-trial/**', '.github/workflows/ptp-driver.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - uses: NuGet/setup-nuget@v2
      - uses: actions/cache@v4
        with:
          path: .build/driver-packages
          key: wdk-x64-${{ hashFiles('windows/Drivers/ListFXFlowPtp/packages.config') }}
      - name: Build unsigned read-only observer (no installation)
        shell: pwsh
        run: ./scripts/build-ptp-driver.ps1
      - name: Test exact-device package preparation (no installation)
        shell: pwsh
        run: ./scripts/test-ptp-package.ps1
      - name: Validate trial package and rollback scope (no installation)
        shell: powershell
        run: ./scripts/ptp-trial/test-validation.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: ListFXFlow-PTP-Observer-Unsigned-x64
          if-no-files-found: error
          path: artifacts/PTP-Driver-Experimental/
